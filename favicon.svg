<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer spinning drum ring -->
  <circle cx="50" cy="50" r="44" stroke="#0ea5e9" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" />
  
  <!-- Outer glowing solid ring wrapper -->
  <circle cx="50" cy="50" r="38" stroke="#bae6fd" stroke-width="1" />
  
  <!-- Inner water droplet & hanger background gradient -->
  <circle cx="50" cy="50" r="35" fill="url(#blue-grad)" />
  
  <!-- Hanger Icon -->
  <g transform="translate(26, 26) scale(2)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2a3 3 0 0 1 3 3c0 1.5-1.5 2-3 3.5V10" />
    <path d="M2 17l10-7 10 7H2z" fill="rgba(255,255,255,0.2)" />
  </g>
  
  <!-- Bubble animations -->
  <circle cx="68" cy="38" r="3" fill="white" opacity="0.8" />
  <circle cx="34" cy="62" r="1.5" fill="white" opacity="0.6" />

  <defs>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
</svg>
