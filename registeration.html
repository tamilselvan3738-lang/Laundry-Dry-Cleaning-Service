  <!-- CLIENT-SIDE SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const htmlElement = document.documentElement;

      // Dark Mode elements
      const darkModeBtn = document.getElementById("dark-mode-btn");
      const moonIcon = document.getElementById("moon-icon");
      const sunIcon = document.getElementById("sun-icon");

      // RTL elements
      const rtlModeBtn = document.getElementById("rtl-mode-btn");
      const rtlIcon = document.getElementById("rtl-icon");

      // Password toggle elements
      const passwordInput = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("toggle-password");
      const eyeIcon = document.getElementById("eye-icon");

      const confirmPasswordInput = document.getElementById("confirm-password");
      const toggleConfirmPasswordBtn = document.getElementById("toggle-confirm-password");
      const confirmEyeIcon = document.getElementById("confirm-eye-icon");

      // ==========================================
      // 1. THEME / DARK MODE MANAGER
      // ==========================================
      function updateThemeUI(isDark) {
        if (isDark) {
          htmlElement.classList.add("dark");
          moonIcon.classList.add("hidden");
          sunIcon.classList.remove("hidden");
        } else {
          htmlElement.classList.remove("dark");
          moonIcon.classList.remove("hidden");
          sunIcon.classList.add("hidden");
        }
      }

      function toggleDarkMode() {
        const isDark = !htmlElement.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        updateThemeUI(isDark);
      }

      darkModeBtn.addEventListener("click", toggleDarkMode);

      // Initialize Theme
      const savedTheme = localStorage.getItem("theme");
      const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const initialDark = savedTheme === "dark" || (!savedTheme && systemPrefersDark);
      updateThemeUI(initialDark);

      // ==========================================
      // 2. LAYOUT DIRECTION (RTL) MANAGER
      // ==========================================
      function updateRtlUI(isRtl) {
        if (isRtl) {
          htmlElement.setAttribute("dir", "rtl");
          rtlModeBtn.setAttribute("aria-checked", "true");
          rtlIcon.classList.add("rotate-180");
        } else {
          htmlElement.setAttribute("dir", "ltr");
          rtlModeBtn.setAttribute("aria-checked", "false");
          rtlIcon.classList.remove("rotate-180");
        }
      }

      function toggleRtlMode() {
        const isRtl = htmlElement.getAttribute("dir") !== "rtl";
        localStorage.setItem("rtl", isRtl ? "true" : "false");
        updateRtlUI(isRtl);
      }

      rtlModeBtn.addEventListener("click", toggleRtlMode);

      // Initialize RTL Direction
      const savedRtl = localStorage.getItem("rtl");
      const initialRtl = savedRtl === "true";
      updateRtlUI(initialRtl);

      // ==========================================
      // 3. SHOW / HIDE PASSWORD INPUT
      // ==========================================
      function setupPasswordReveal(inputEl, buttonEl, iconEl) {
        buttonEl.addEventListener("click", () => {
          const isPassword = inputEl.getAttribute("type") === "password";
          if (isPassword) {
            inputEl.setAttribute("type", "text");
            iconEl.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.057 7.018 19 11.5 19c2.478 0 4.795-.87 6.61-2.313m2.222-2.332A9.973 9.973 0 0021.066 12c-1.274-4.057-5.064-7-9.542-7-1.267 0-2.479.248-3.586.702m10.424 9.53L18.42 16.24M3 3l18 18" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12a3 3 0 010-6.102m3 9.102a3 3 0 003-3" />
            `;
          } else {
            inputEl.setAttribute("type", "password");
            iconEl.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
          }
        });
      }

      setupPasswordReveal(passwordInput, togglePasswordBtn, eyeIcon);
      setupPasswordReveal(confirmPasswordInput, toggleConfirmPasswordBtn, confirmEyeIcon);

      // Reveal Page
      htmlElement.classList.add("ready");
    });
  </script>
</body>
</html>
