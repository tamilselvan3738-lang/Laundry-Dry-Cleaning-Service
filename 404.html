<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Lost in the Wash</title>
  <!-- Tailwind CSS v3 via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & responsive safety constraints */
    html {
      visibility: hidden;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      overflow-x: hidden;
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    html.ready {
      visibility: visible;
    }
  </style>
  <style>
    /* Prevent horizontal scrolling and force box-sizing */
    *, *::before, *::after {
      box-sizing: border-box !important;
    }
    html, body {
      max-width: 100% !important;
      overflow-x: clip !important;
    }
    img, video, iframe {
      max-width: 100% !important;
      height: auto !important;
    }
    /* Mobile breakpoint optimizations */
    @media (max-width: 1024px) {
      .max-w-7xl, .container {
        padding-left: 1.5rem !important;
        padding-right: 1.5rem !important;
      }
    }
    @media (max-width: 768px) {
      .max-w-7xl, .container {
        padding-left: 1.25rem !important;
        padding-right: 1.25rem !important;
      }
      /* Collapse non-responsive grid systems on tablet/mobile */
      .grid-cols-2:not([class*="sm:"]):not([class*="md:"]):not([class*="lg:"]),
      .grid-cols-3:not([class*="sm:"]):not([class*="md:"]):not([class*="lg:"]),
      .grid-cols-4:not([class*="sm:"]):not([class*="md:"]):not([class*="lg:"]) {
        grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
      }
    }
    @media (max-width: 480px) {
      .max-w-7xl, .container {
        padding-left: 1rem !important;
        padding-right: 1rem !important;
      }
      h1 {
        font-size: 1.85rem !important;
        line-height: 1.2 !important;
      }
      h2 {
        font-size: 1.45rem !important;
        line-height: 1.25 !important;
      }
      h3 {
        font-size: 1.25rem !important;
      }
      p {
        font-size: 0.85rem !important;
      }
    }
    @media (max-width: 320px) {
      .max-w-7xl, .container {
        padding-left: 0.75rem !important;
        padding-right: 0.75rem !important;
      }
      h1 {
        font-size: 1.5rem !important;
      }
      h2 {
        font-size: 1.2rem !important;
      }
      p {
        font-size: 0.75rem !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans transition-colors duration-300 min-h-screen flex flex-col justify-between">

  <!-- TOP BAR: UTILITY TOGGLES -->
  <header class="p-4 sm:p-6 flex items-center justify-end w-full max-w-7xl mx-auto">
    <div class="flex items-center gap-3">
      <!-- Dark Mode Toggle Button -->
      <button id="dark-mode-btn" class="p-2 rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary-600 dark:hover:text-primary-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500" aria-label="Toggle Dark Mode">
        <svg id="moon-icon" class="w-5 h-5 transition-transform duration-300 hover:rotate-12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg id="sun-icon" class="hidden w-5 h-5 text-slate-300 transition-transform duration-300 hover:rotate-45" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
      </button>

      <!-- RTL/LTR Toggle Button -->
      <button id="rtl-mode-btn" class="p-2 rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary-600 dark:hover:text-primary-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500" aria-label="Toggle Right to Left direction">
        <svg id="rtl-icon" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M4 8h16M16 4l4 4-4 4" />
          <path d="M20 16H4M8 12l-4 4 4 4" />
        </svg>
      </button>
    </div>
  </header>

  <!-- CENTERED 404 CARD -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-xl text-center space-y-8 p-8 sm:p-12 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-700 transition-all duration-300 relative overflow-hidden">
      
      <!-- BACKGROUND BUBBLES EFFECTS -->
      <div class="absolute -top-12 -left-12 w-24 h-24 bg-primary-100/40 dark:bg-primary-950/20 rounded-full blur-xl"></div>
      <div class="absolute -bottom-16 -right-16 w-36 h-36 bg-primary-200/30 dark:bg-primary-900/10 rounded-full blur-xl"></div>

      <!-- 404 ILLUSTRATION -->
      <div class="relative flex flex-col items-center justify-center">
        <!-- Giant bubbly 404 text -->
        <h1 class="text-8xl sm:text-9xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-primary-400 to-primary-600 dark:from-primary-500 dark:to-primary-300 drop-shadow-md select-none animate-pulse">
          404
        </h1>
        
        <!-- Misplaced Clothes Pile SVG Icon -->
        <div class="relative w-24 h-24 mt-4">
          <!-- Spinning machine drum background -->
          <svg class="absolute inset-0 w-full h-full text-slate-200 dark:text-slate-700 animate-[spin_20s_linear_infinite]" viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="3" stroke-dasharray="10 8" />
          </svg>
          
          <!-- Hanger & Lost Clothes Outline -->
          <div class="absolute inset-4 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-full flex items-center justify-center shadow-inner">
            <svg class="w-8 h-8 text-primary-500 dark:text-primary-400 animate-bounce" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <!-- Hanger shape flipped upside down (lost/dropped) -->
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 22a3 3 0 003-3c0-1.5-1.5-2-3-3.5V14" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M22 7l-10 7L2 7h20z" />
            </svg>
          </div>
          
          <!-- Bubbles rising -->
          <span class="absolute -top-1 left-4 w-2 h-2 bg-primary-300/60 dark:bg-primary-500/40 rounded-full animate-ping"></span>
          <span class="absolute -top-3 right-6 w-3 h-3 bg-primary-200/50 dark:bg-primary-400/30 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
          <span class="absolute bottom-1 -right-2 w-1.5 h-1.5 bg-primary-400/40 rounded-full animate-pulse" style="animation-delay: 0.5s"></span>
        </div>
      </div>

      <!-- ERROR MESSAGE -->
      <div class="space-y-3 relative z-10">
        <h2 class="text-2xl sm:text-3xl font-black text-slate-800 dark:text-white uppercase tracking-tight">
          Page Shrunk in the Wash!
        </h2>
        <p class="text-sm sm:text-base text-slate-500 dark:text-slate-400 max-w-md mx-auto">
          The page you are looking for has been misplaced in the dryer lint trap, shrunk in a hot cycle, or never existed in our laundry basket.
        </p>
      </div>

      <!-- ACTIONS -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4 relative z-10">
        <button onclick="history.back();" class="w-full sm:w-auto px-6 py-3 rounded-xl text-sm font-bold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
          Go Back
        </button>
        <a href="navbar.html" class="w-full sm:w-auto px-8 py-3 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-700 hover:to-primary-600 shadow-md hover:shadow-lg transition-all">
          Return Home
        </a>
      </div>

    </div>
  </main>

  <!-- LEGAL FOOTER -->
  <footer class="p-4 sm:p-6 text-center text-xs text-slate-400 dark:text-slate-500">
    <p>&copy; 2026 Laundry & Dry Cleaning Service. All rights reserved. Clean code guaranteed.</p>
  </footer>

  <!-- CLIENT-SIDE SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const htmlElement = document.documentElement;

      // Dark Mode elements
      const darkModeBtn = document.getElementById("dark-mode-btn");
      const moonIcon = document.getElementById("moon-icon");
      const sunIcon = document.getElementById("sun-icon");

      // RTL elements
      const rtlModeBtn = document.getElementById("rtl-mode-btn");
      const rtlIcon = document.getElementById("rtl-icon");

      // ==========================================
      // 1. THEME / DARK MODE MANAGER
      // ==========================================
      function updateThemeUI(isDark) {
        if (isDark) {
          htmlElement.classList.add("dark");
          moonIcon.classList.add("hidden");
          sunIcon.classList.remove("hidden");
        } else {
          htmlElement.classList.remove("dark");
          moonIcon.classList.remove("hidden");
          sunIcon.classList.add("hidden");
        }
      }

      function toggleDarkMode() {
        const isDark = !htmlElement.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        updateThemeUI(isDark);
      }

      darkModeBtn.addEventListener("click", toggleDarkMode);

      // Initialize Theme
      const savedTheme = localStorage.getItem("theme");
      const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const initialDark = savedTheme === "dark" || (!savedTheme && systemPrefersDark);
      updateThemeUI(initialDark);

      // ==========================================
      // 2. LAYOUT DIRECTION (RTL) MANAGER
      // ==========================================
      function updateRtlUI(isRtl) {
        if (isRtl) {
          htmlElement.setAttribute("dir", "rtl");
          rtlModeBtn.setAttribute("aria-checked", "true");
          rtlIcon.classList.add("rotate-180");
        } else {
          htmlElement.setAttribute("dir", "ltr");
          rtlModeBtn.setAttribute("aria-checked", "false");
          rtlIcon.classList.remove("rotate-180");
        }
      }

      function toggleRtlMode() {
        const isRtl = htmlElement.getAttribute("dir") !== "rtl";
        localStorage.setItem("rtl", isRtl ? "true" : "false");
        updateRtlUI(isRtl);
      }

      rtlModeBtn.addEventListener("click", toggleRtlMode);

      // Initialize RTL Direction
      const savedRtl = localStorage.getItem("rtl");
      const initialRtl = savedRtl === "true";
      updateRtlUI(initialRtl);

      // Reveal Page
      htmlElement.classList.add("ready");
    });
  </script>
</body>
</html>
